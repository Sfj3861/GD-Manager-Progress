name: Build Geode mod
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            target: Win64
          - platform: android
            runner: ubuntu-latest
            target: Android64
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GD-Manager-Progress-${{ matrix.platform }}
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
